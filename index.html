<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>IoT NPTEL Quiz</title>
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="IoT Quiz">
    <style>
        * {
            box-sizing: border-box
        }

        :root {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f4f5fb;
            --card: #fff;
            --tx: #161a29;
            --mu: #677089;
            --ac: #4f46e5;
            --ac2: #9333ea;
            --ok: #16a34a;
            --bad: #dc2626;
            --bd: #e3e6f0;
            --sh: 0 1px 2px rgba(20, 24, 60, .04), 0 6px 20px rgba(20, 24, 60, .06);
            --r: 16px
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0e1017;
                --card: #181c27;
                --tx: #e8eaf3;
                --mu: #98a0b6;
                --ac: #6e76f2;
                --ac2: #a855f7;
                --ok: #4ade80;
                --bad: #f87171;
                --bd: #2a3044;
                --sh: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35)
            }
        }

        :root[data-theme=dark] {
            --bg: #0e1017;
            --card: #181c27;
            --tx: #e8eaf3;
            --mu: #98a0b6;
            --ac: #6e76f2;
            --ac2: #a855f7;
            --ok: #4ade80;
            --bad: #f87171;
            --bd: #2a3044;
            --sh: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35)
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%
        }

        button,
        label {
            font: inherit;
            color: inherit;
            cursor: pointer;
            touch-action: manipulation
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 5;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--bd)
        }

        .tb {
            max-width: 960px;
            margin: 0 auto;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 700;
            line-height: 1.15
        }

        .brand small {
            display: block;
            font-weight: 500;
            font-size: .72rem;
            color: var(--mu)
        }

        .lg {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            display: grid;
            place-items: center
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px 56px
        }

        main>* {
            animation: in .3s ease both
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .mu {
            color: var(--mu)
        }

        .tag {
            color: var(--mu);
            font-size: .85rem
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .hero {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            align-items: center;
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            color: #fff;
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--sh)
        }

        .hero h1 {
            font-size: 1.9rem;
            line-height: 1.15;
            margin: 0 0 8px;
            letter-spacing: -.02em
        }

        .hp {
            margin: 0;
            opacity: .92
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .stats div {
            background: rgba(255, 255, 255, .16);
            border-radius: 14px;
            padding: 12px;
            text-align: center
        }

        .stats b {
            display: block;
            font-size: 1.5rem;
            line-height: 1.2
        }

        .stats span {
            font-size: .75rem;
            opacity: .92
        }

        .sh {
            margin: 30px 0 12px;
            font-size: 1.1rem;
            letter-spacing: -.01em
        }

        .grid {
            display: grid;
            gap: 12px
        }

        .g2 {
            grid-template-columns: repeat(2, 1fr)
        }

        .g3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .mode,
        .tile {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: var(--r);
            padding: 16px;
            box-shadow: var(--sh);
            transition: .15s;
            text-align: left
        }

        .mode:hover,
        .tile:hover {
            transform: translateY(-2px);
            border-color: var(--ac)
        }

        .mode:active,
        .tile:active {
            transform: scale(.98)
        }

        .mode {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .mode i {
            font-style: normal;
            font-size: 1.5rem;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: color-mix(in srgb, var(--ac) 12%, var(--card));
            flex: none
        }

        .mode b,
        .tile b {
            display: block;
            line-height: 1.25
        }

        .mode span {
            color: var(--mu);
            font-size: .85rem
        }

        .tile {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 2px 12px;
            align-items: center;
            padding: 14px
        }

        .wk {
            grid-row: span 2;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700
        }

        .mini {
            grid-column: 1/-1;
            height: 5px;
            border-radius: 9px;
            background: var(--bd);
            margin-top: 10px;
            overflow: hidden
        }

        .mini i {
            display: block;
            height: 100%;
            background: var(--ok)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: var(--r);
            padding: 16px;
            box-shadow: var(--sh)
        }

        .sw {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            color: var(--mu)
        }

        .sw input {
            width: 20px;
            height: 20px;
            accent-color: var(--ac)
        }

        .chip {
            position: relative
        }

        .chip input {
            position: absolute;
            opacity: 0
        }

        .chip span {
            display: inline-block;
            padding: 8px 14px;
            border: 1.5px solid var(--bd);
            border-radius: 99px;
            margin: 0 6px 8px 0
        }

        .chip input:checked+span {
            background: var(--ac);
            color: #fff;
            border-color: var(--ac)
        }

        input[type=number] {
            font: inherit;
            font-size: 16px;
            padding: 9px;
            border-radius: 10px;
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            width: 72px
        }

        .pri {
            background: linear-gradient(135deg, var(--ac), var(--ac2));
            color: #fff;
            border: 0;
            border-radius: 12px;
            padding: 13px 22px;
            font-weight: 600;
            box-shadow: var(--sh)
        }

        .sec {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 9px 14px
        }

        .qw {
            max-width: 720px;
            margin: 0 auto
        }

        .qh {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .qt {
            flex: 1;
            line-height: 1.25
        }

        .qt b {
            display: block
        }

        .qt span {
            color: var(--mu);
            font-size: .85rem
        }

        .sc {
            font-weight: 700;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 7px 12px
        }

        .bar {
            height: 8px;
            background: var(--bd);
            border-radius: 9px;
            overflow: hidden;
            margin: 14px 0 16px
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--ac), var(--ac2));
            transition: width .3s
        }

        .qc {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--sh)
        }

        .qc h2 {
            font-size: 1.25rem;
            margin: 14px 0 16px;
            line-height: 1.4;
            letter-spacing: -.01em
        }

        .chip2 {
            font-size: .75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 99px;
            background: color-mix(in srgb, var(--ac) 12%, var(--card));
            color: var(--ac)
        }

        .chip2.m {
            background: color-mix(in srgb, #f59e0b 18%, var(--card));
            color: #d97706
        }

        .star {
            margin-left: auto;
            padding: 4px 12px;
            font-size: 1.05rem
        }

        .opt {
            display: flex;
            align-items: flex-start;
            width: 100%;
            text-align: left;
            min-height: 54px;
            padding: 12px 14px;
            margin: 8px 0;
            background: var(--card);
            border: 1.5px solid var(--bd);
            border-radius: 14px;
            line-height: 1.4;
            transition: .12s
        }

        .opt:hover:not(:disabled) {
            border-color: var(--ac)
        }

        .opt:active:not(:disabled) {
            transform: scale(.99)
        }

        .opt b {
            flex: none;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 8px;
            background: var(--bd);
            margin-right: 12px;
            font-size: .85rem
        }

        .opt span {
            padding-top: 2px
        }

        .opt.sel {
            border-color: var(--ac);
            background: color-mix(in srgb, var(--ac) 10%, var(--card))
        }

        .opt.sel b {
            background: var(--ac);
            color: #fff
        }

        .opt.ok {
            border-color: var(--ok);
            background: color-mix(in srgb, var(--ok) 14%, var(--card))
        }

        .opt.ok b,
        .opt.miss b {
            background: var(--ok);
            color: #fff
        }

        .opt.bad {
            border-color: var(--bad);
            background: color-mix(in srgb, var(--bad) 14%, var(--card))
        }

        .opt.bad b {
            background: var(--bad);
            color: #fff
        }

        .opt.miss {
            border: 1.5px dashed var(--ok);
            background: color-mix(in srgb, var(--ok) 8%, var(--card))
        }

        .opt.ok::after,
        .opt.bad::after,
        .opt.miss::after {
            margin-left: auto;
            padding-left: 8px;
            font-weight: 700;
            white-space: nowrap
        }

        .opt.ok::after {
            content: "✓";
            color: var(--ok)
        }

        .opt.bad::after {
            content: "✗";
            color: var(--bad)
        }

        .opt.miss::after {
            content: "Missed";
            color: var(--ok);
            font-size: .8rem
        }

        .ex {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: color-mix(in srgb, var(--ac) 9%, var(--card));
            border-left: 4px solid var(--ac);
            font-size: .93rem;
            line-height: 1.45
        }

        #nx {
            position: sticky;
            bottom: 0;
            padding: 12px 0 8px;
            margin-top: 8px;
            background: linear-gradient(transparent, var(--bg) 35%)
        }

        #nx .pri {
            width: 100%;
            padding: 15px
        }

        .rs {
            text-align: center;
            padding: 8px 0 4px
        }

        .rs h1 {
            margin: 16px 0 4px;
            font-size: 1.6rem
        }

        .ring {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            margin: 0 auto;
            display: grid;
            place-items: center;
            background: conic-gradient(var(--ac) calc(var(--p)*1%), var(--bd) 0)
        }

        .ring>div {
            width: 134px;
            height: 134px;
            border-radius: 50%;
            background: var(--bg);
            display: grid;
            place-content: center
        }

        .ring b {
            font-size: 2.4rem;
            line-height: 1
        }

        .ring span {
            color: var(--mu);
            font-size: .85rem
        }

        .m3 {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 16px 0
        }

        .m3 div {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 10px 18px;
            min-width: 84px
        }

        .m3 b {
            display: block;
            font-size: 1.25rem
        }

        .m3 span {
            font-size: .75rem;
            color: var(--mu)
        }

        .res {
            justify-content: center
        }

        .rv {
            margin: 10px 0
        }

        .rv p {
            margin: 8px 0
        }

        .ca {
            color: var(--ok);
            font-weight: 600
        }

        .a2h {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: var(--r);
            box-shadow: var(--sh)
        }

        .a2h>div {
            flex: 1;
            line-height: 1.25
        }

        .a2h b {
            display: block
        }

        .a2h .pri {
            padding: 9px 18px
        }

        .x {
            background: none;
            border: 0;
            color: var(--mu);
            padding: 6px;
            font-size: 1rem
        }

        .ov {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, .5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: in .2s
        }

        .sheet {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            color: var(--tx);
            border-radius: 22px 22px 0 0;
            padding: 22px 20px calc(20px + env(safe-area-inset-bottom, 0px))
        }

        .sheet ol {
            margin: 0 0 16px;
            padding-left: 22px
        }

        .sheet li {
            margin: 8px 0
        }

        @media(max-width:720px) {
            .hero {
                grid-template-columns: 1fr;
                padding: 22px
            }

            .hero h1 {
                font-size: 1.5rem
            }

            .g2,
            .g3 {
                grid-template-columns: 1fr
            }

            .res {
                flex-direction: column;
                align-items: stretch
            }

            .res button {
                width: 100%;
                padding: 14px
            }

            main {
                padding: 14px 12px 40px
            }

            .qc {
                padding: 16px
            }
        }
    </style>
</head>

<body>
    <header class="top">
        <div class="tb">
            <div class="brand" onclick="home()"><span class="lg">🧠</span><span>IoT Quiz<small>NPTEL · IIT
                        Kharagpur</small></span></div><button class="sec" onclick="theme()"
                aria-label="Toggle theme">◐</button>
        </div>
    </header>
    <main id="app"></main>
    <script>
        const q = (t, o, a) => ({ t, o, a });
        const TF = ["True", "False"];
        const W = {
            5: {
                n: "Week 5 · Interoperability & Arduino", q: [
                    q("What does interoperability allow IoT devices to do?", ["Communicate and exchange data", "Work only offline", "Use only one protocol", "Disable other devices"], 0),
                    q("Syntactic interoperability deals with:", ["Message format", "Battery size", "Device colour", "Sensor weight"], 0),
                    q("What does UMB stand for?", ["Universal Middleware Bridge", "Unified Mobile Board", "Universal Memory Block", "User Management Bridge"], 0),
                    q("What is the operating voltage of the Arduino UNO?", ["3.3 V", "5 V", "9 V", "12 V"], 1),
                    q("What is a program written in the Arduino IDE called?", ["Packet", "Sketch", "Frame", "Query"], 1),
                    q("Which interface is mainly used to connect an Arduino UNO to a computer?", ["HDMI", "USB", "VGA", "Ethernet"], 1),
                    q("What is the conventional starting index of an array in Arduino programming?", ["-1", "0", "1", "2"], 1),
                    q("Which Arduino function is used to generate a pseudo-random number within a specified range?", ["random()", "pinMode()", "digitalWrite()", "attachInterrupt()"], 0),
                    q("In the traffic-control example, which LED is switched ON first to represent the GO signal?", ["Red LED", "Yellow LED", "Green LED", "All three LEDs simultaneously"], 2),
                    q("Which quantities are measured by a DHT sensor?", ["Temperature and humidity", "Distance and speed", "Light and sound", "Pressure and altitude"], 0),
                    q("What does a sensor convert a physical quantity into?", ["A software program", "Mechanical motion", "A network address", "An electrical signal"], 3),
                    q("In the DHT sensor sketch, delay(2000) causes successive readings to be printed after approximately how much time?", ["0.2 seconds", "1 second", "2 seconds", "20 seconds"], 2),
                    q("State whether the following statement is True or False.<br><br>Statement: A servo motor is a low-precision motor used only for linear motion.", TF, 1),
                    q("Which device provides controlled rotary motion?", ["Ultrasonic sensor", "DHT sensor", "PIR sensor", "Servo motor"], 3),
                    q("State whether the following statement is True or False.<br><br>Statement: A stepper motor is a type of actuator.", TF, 0)]
            },
            6: {
                n: "Week 6 · Python & Raspberry Pi", q: [
                    q("What are the five basic data types available in Python, as introduced in the lecture?", ["Numbers, Strings, List, Tuple, Dictionary", "Integer, Float, Boolean, Char, Byte", "Array, Struct, Class, Object, Set", "Numbers, Strings, Queue, Stack, Graph"], 0),
                    q("Which keyword is used to define a function in Python?", ["func", "def", "define", "function"], 1),
                    q("In Python's exception handling, which keyword is used to handle an exception raised inside the try block?", ["catch", "except", "handle", "rescue"], 1),
                    q("Which mode of Python's open() function is used to add data to the end of an existing file without erasing its existing content?", ["r (read mode)", "w (write mode)", "a (append mode)", "r+ (read and write mode)"], 2),
                    q("Which Python library, installable via pip, is used for image read/write operations as covered in the lecture?", ["NumPy", "PIL / Pillow", "OpenCV", "Matplotlib"], 1),
                    q("Which socket_type value is used while creating a TCP/IP socket in Python's socket module?", ["SOCK_DGRAM", "SOCK_STREAM", "SOCK_RAW", "SOCK_SEQPACKET"], 1),
                    q("How many GPIO pins does the Raspberry Pi 3 Model B have, as shown in the specifications table?", ["26", "32", "40", "44"], 2),
                    q("Which of the following is an officially supported operating system for Raspberry Pi mentioned in the lecture?", ["Raspbian", "Windows XP", "macOS", "Solaris"], 0),
                    q("Raspberry Pi is best described as a:", ["Printer", "Smartphone", "Wi-Fi router", "Single-board computer"], 3),
                    q("Which command is used to install the GPIO library on Raspberry Pi before programming the blinking LED example?", ["sudo apt-get install python-rpi.gpio", "pip install gpio", "sudo apt-get install led-lib", "npm install rpi-gpio"], 0),
                    q("Where is the CSI camera connector slot located on the Raspberry Pi board?", ["Between the USB ports", "Between the Ethernet port and the HDMI port", "Next to the power supply pin", "On the underside of the board"], 1),
                    q("Which terminal command captures a still image using the Raspberry Pi camera?", ["raspistill -o image.jpg", "raspicam capture", "pi-camera snap", "capture.py --img"], 0),
                    q("What does DHT stand for in the DHT sensor used with Raspberry Pi in the auto-cooling system?", ["Digital Heat Transfer", "Digital Humidity and Temperature", "Direct Hardware Trigger", "Dual Humidity Thermostat"], 1),
                    q("How many output terminals does the relay used in the temperature-dependent auto-cooling system have, as shown in the lecture?", ["2", "3", "4", "5"], 1),
                    q("State whether the following statement is True or False.<br><br>Statement: In the temperature-dependent auto-cooling system, the fan operates when the surrounding temperature rises above the threshold value specified in the code.", TF, 0)]
            },
            7: {
                n: "Week 7 · Remote Logging & SDN", q: [
                    q("In the remote data logging system, which socket type is used to send sensor data from the client to the server?", ["SOCK_STREAM", "SOCK_DGRAM", "SOCK_RAW", "SOCK_SEQPACKET"], 1),
                    q("Which Adafruit function is used in the client code to read humidity and temperature values from the DHT sensor?", ["Adafruit_DHT.read_retry()", "Adafruit_DHT.get_data()", "Adafruit_DHT.sense()", "Adafruit_DHT.capture()"], 0),
                    q("Where does the server in the remote data logging example save the data received from the client as mentioned in the lecture?", ["In a MySQL database", "In a text file named Datalog.txt", "On a cloud dashboard", "In an Excel spreadsheet"], 1),
                    q("Which Python string function is used to split the comma-separated sensor data into separate values on the server?", ["split()", "divide()", "partition()", "separate()"], 0),
                    q("State whether the following statement is True or False.<br><br>Statement: Matplotlib Python library is used to plot the temperature and humidity data received at the server in the lecture.", ["False", "True"], 1),
                    q("Which matplotlib function turns on interactive mode so that the plot updates in real time as new data arrives?", ["ion()", "grid()", "subplot()", "figure()"], 0),
                    q("In a traditional (non-SDN) network, where does the routing protocol logic (e.g., OSPF) mainly execute?", ["In a centralized controller", "At the individual switches", "On the end-user device", "In the cloud"], 1),
                    q("In which year was the OpenFlow project — from which the idea of software-defined networking originated — presented at ACM SIGCOMM?", ["2006", "2008", "2009", "2011"], 1),
                    q("What message does a switch send to the SDN controller when it receives a packet for which no matching flow-rule exists?", ["PACKET-IN message", "FLOW-REQUEST message", "RULE-MISS alert", "CONTROL-SYNC message"], 0),
                    q("Which SDN API is used for communication between the control layer and the infrastructure layer?", ["Northbound API", "Southbound API", "East-Westbound API", "North-Southbound API"], 1),
                    q("According to the lecture, approximately how many requests per second can a typical SDN controller handle through a single thread?", ["50", "100", "200", "500"], 2),
                    q("Which control mechanism is described where the entire network's control decisions are taken by a single controller?", ["Distributed control", "Centralized control", "Hierarchical control", "Federated control"], 1),

        const E = {
            1: ["The ITU report describes a future where humans may become a minority as generators and receivers of traffic. Instead, communication will increasingly happen between devices and “things,” forming the Internet of Things.", "IoT systems require scalable architecture, clear naming and addressing, and must support heterogeneous devices such as sleeping nodes, mobile nodes, and non-IP devices. However, IoT systems may have intermittent connectivity, so option d is incorrect.", "Smart Dust refers to extremely small computing devices, smaller than a grain of sand, that can be used to measure chemicals in soil or diagnose problems in the human body.", "M2M focuses mainly on communication among machines and devices. IoT is broader because it includes interactions between things, people, applications, and systems.", "The Web of Things does not replace sensors. Sensors remain responsible for collecting physical-world data, while web technologies help expose and access IoT resources.", "Using locally valid addresses within a gateway’s domain allows address reuse across different gateway domains. This helps avoid unnecessary wastage of global addresses.", "IoT gateways can provide Internet connectivity and IoT LAN intra-connectivity. They may obtain upstream prefixes through DHCPv6 and delegate them to nodes using SLAAC.", "IPv4 uses 32-bit addresses and dotted decimal notation, whereas IPv6 uses 128-bit addresses and hexadecimal notation. This makes IPv6 more suitable for large-scale IoT addressing.", "A good sensor should measure the desired property, remain insensitive to unrelated properties, and should not influence or alter the measured quantity.", "Resolution refers to the smallest detectable change in the measured quantity. In digital sensors, it is related to the smallest digital output step. However, accuracy and resolution are not the same; a high-resolution sensor may still be inaccurate if it has bias or calibration errors.", "A vector sensor measures quantities that have both magnitude and direction or orientation. Since an accelerometer measures acceleration components along different coordinate axes, such as x, y, and z, it is classified as a vector sensor.", "Hysteresis error occurs when the sensor output depends on the previous input history. The same present input may give different readings depending on whether the input was approached from a lower or higher value.", "A hydraulic actuator uses hydraulic fluid to generate mechanical motion. Since liquids are nearly incompressible, hydraulic actuators can exert large forces.", "Shape Memory Polymer actuators can respond to different stimuli and are known for features such as low density, high strain recovery, biocompatibility, and biodegradability. They are actuator materials, not merely passive temperature sensors.", "In the example IoT implementation, the sensor first collects the data. The data then passes through the gateway and proxy server before reaching the cloud server for further processing and analytics."],
        2: ["The MQTT broker dispatches messages between senders and receivers. The topic included in a published message provides the routing information that the broker uses to deliver the message to clients subscribed to the matching topic.", "The plus sign (+) is a single-level wildcard, whereas the hash sign (#) is a multilevel wildcard. Thus, house/+/temperature can match house/kitchen/temperature, and house/# matches all topics whose hierarchy begins with house, not only the exact topic house.", "SMQTT consists of four main stages: setup, encryption, publish, and decryption. Route discovery is not one of the SMQTT stages.", "CoAP is designed for constrained environments and operates over UDP at the transport layer. Its lightweight design helps reduce communication overhead for resource-constrained IoT devices.", "In the piggyback mode, the server places its response in the acknowledgment message. In the separate mode, the acknowledgment is sent first and the response is transmitted later as a separate message.", "As presented in the lecture, CoAP uses GET, PUT, PUSH, and DELETE requests to retrieve, create, update, and delete data, respectively.", "The Flow frame controls the rate of message flow between AMQP peers. By comparison, Transfer carries messages, Disposition communicates a change in transfer state, and Detach terminates a link.", "The main AMQP components discussed in the lecture are exchanges, queues, and bindings. An exchange receives and routes messages, a queue stores messages for consumers or business processes, and a binding defines the distribution rules connecting exchanges to queues.", "The lecture associates IEEE 802.15.4c with China, 802.15.4d with Japan, 802.15.4e with industrial applications, 802.15.4f with active RFID, and 802.15.4g with smart utility networks.", "Non-beacon-enabled IEEE 802.15.4 networks transmit data frames using unslotted CSMA/CA. In contrast, beacon-enabled networks use slotted CSMA/CA with a superframe structure managed by the PAN coordinator.", "IEEE 802.15.4 primarily specifies the physical and MAC layers. ZigBee operates on top of these layers and adds higher-layer functions, including authentication, encryption, routing, forwarding, and support for mesh networking.", "A ZigBee end device has sufficient functionality to communicate with its parent, but it cannot relay data for other devices. It is therefore a reduced-functionality device. The coordinator, not an end device, forms the network root and may act as the trust center.", "6LoWPAN supports 16-bit short addresses for PAN-specific communication; these are assigned by the PAN coordinator. It also supports 64-bit extended addresses, which are globally unique.", "In LOADng, only the destination is permitted to respond to an RREQ. Intermediate LOADng routers are explicitly prohibited from responding, even when they have an active route to the requested destination.", "Passive RFID tags do not have their own power supply. They must first be powered inductively by an RFID reader before they can transmit information. Active RFID tags, in contrast, have their own power supply."],
            3: ["There is no network layer in Wired HART.", "Zwave operates at 908.42 MHz in the US and 868.42 MHz in Europe.", "Dumb behavior of sensor nodes is Temporal in nature (as it is dependent on the effects of the environmental conditions).", "Channel Blacklisting identifies channels consistently affected by interference and removes them from use.", "The full form of NFC is Near Field Communication.", "NFC works on the principle of magnetic induction.", "Passive NFC tags found in supermarket products are examples of passive NFC.", "Bluetooth is based on Piconets.", "A reader in NFC emits a small electric current which creates a magnetic field that in turn bridges the physical space between the devices.", "Bluetooth technology is based on Ad-hoc network technology.", "Zwave utilizes GFSK modulation and Manchester channel encoding.", "The process of bypassing radio dead-spots is done using a message called Healing in Zwave.", "Sensors nodes have limited battery life.", "The Link Manager Protocol in Bluetooth manages the establishment, authentication, link configuration.", "Zigbee commonly uses 250 kbps data rate."],
                4: ["In the Agricultural Intrusion Detection system, the ultrasonic sensor measures the distance at which the detected object is located.", "The microcontroller processes the data received from the sensors in the AID system.", "The lecture discusses electromagnetic and molecular communication for nanodevices.", "Sensing coverage guarantees connectivity when the transmission range is at least twice the sensing range.", "Area coverage is a standard coverage problem in a static wireless sensor network. The other options are networking tasks, not coverage categories.", "Forest-fire monitoring uses event-driven reporting because sensor nodes report data when a fire-related event is detected. The lecture contrasts this with on-demand reporting, such as an inventory-control system.", "A data mule visits sensor nodes, collects their data, and delivers it to the sink.", "Failure of a critical stationary node may divide the network into disconnected parts.", "In human-centric sensing, a person may act as a data source by providing or collecting information.", "In a stationary wireless sensor network, sensor nodes remain fixed. Therefore, deployment and topology maintenance are comparatively easier.", "UAVs move from one location to another, causing frequent changes in their relative positions and communication links. Therefore, the network topology may change frequently.", "UAV movement causes frequent changes in network topology and communication links.", "Traditional SCADA commonly uses isolated proprietary systems, while M2M supports cross-platform integration.", "In a stationary wireless sensor network, sensor nodes remain fixed. Therefore, they cannot move automatically to repair connectivity after a node failure.", "M2M communication allows machines or devices to exchange data automatically. Human intervention may still be required for maintenance and operational stability."],
                    5: ["Interoperability enables different IoT devices and systems to communicate and exchange data.", "Syntactic interoperability concerns the format of messages exchanged between devices and users.", "UMB stands for Universal Middleware Bridge. It helps different middleware-based devices work together.", "The Arduino UNO operates at 5 volts.", "A program created and uploaded using the Arduino IDE is called a sketch.", "The Arduino UNO uses a USB interface to connect to a computer. The USB connection can be used to upload programs to the board and also provide power during development.", "As in C and C++, Arduino arrays use zero-based indexing. Therefore, the first element is stored at index 0.", "The random() function generates a pseudo-random number in a specified range. For example, random(max) produces a value within the range defined by max.", "The traffic() function first sets the green LED HIGH and displays the GO message. After a delay, it switches to yellow and then red.", "A DHT sensor measures the temperature and humidity of its surroundings.", "A sensor is an electronic element that converts a physical quantity or measurement into an electrical signal.", "The delay() function takes time in milliseconds. Therefore, delay(2000) introduces a delay of 2000 milliseconds, which equals 2 seconds.", "A servo motor is a high-precision motor that provides controlled rotary motion.", "A servo motor is an actuator that provides precise and controlled rotary motion.", "A stepper motor is one of the motor actuators discussed in the lecture. Other examples include servo motors, hydraulic motors, solenoids, relays, and AC motors."],
                        6: ["The lecture states that Python has five data types: Numbers, String, List, Tuple, and Dictionary.", "A function in Python is defined using the def keyword, followed by the function name and its arguments.", "Python uses the try, except and else block structure for exception handling; the except block catches the exception raised in the try block.", "Python supports four basic file modes: r (read), w (write), a (append), and r+ (read and write). The append mode adds new data to the end of the file without deleting existing content.", "PIL (Python Image Library) is used to work with image files. It is installed using 'sudo pip install pillow'; PIL supports up to Python 2.7 while Pillow supports Python 3.x.", "A socket is created using socket.socket(socket_family, socket_type, protocol). For a TCP/IP (connection-oriented) socket, socket_family is AF_INET and socket_type is SOCK_STREAM.", "As per the specifications table, the Raspberry Pi 3 Model B, Raspberry Pi 2 Model B, and Raspberry Pi Zero all have 40 GPIO pins.", "Raspbian and NOOBS are the officially supported operating systems for Raspberry Pi. Ubuntu Mate, Snappy Ubuntu Core, Windows 10 Core, Pinet, and RISC OS are examples of third-party operating systems.", "The lecture introduces Raspberry Pi as a computer that fits in your palm — a low-cost, single-board computer that is easy to access and use.", "After installing Python development tools using 'sudo apt-get install python-dev', the GPIO library is installed using 'sudo apt-get install python-rpi.gpio'.", "The Raspberry Pi Camera connects through a dedicated CSI slot, which is placed between the Ethernet port and the HDMI port on the board.", "Running 'raspistill -o image.jpg' in the terminal captures an image using the Raspberry Pi camera and stores it as image.jpg.", "DHT stands for Digital Humidity and Temperature Sensor. It has 4 pins: PIN 1 (3.3V–5V power supply), PIN 2 (Data), PIN 3 (Null), and PIN 4 (Ground).", "The relay is a mechanical/electromechanical switch with 3 output terminals (left to right): NO (normal open), Common, and NC (normal close).", "The lecture demonstrates that the fan is switched on whenever the measured temperature exceeds the threshold value set in the program."],
                            7: ["The client creates a UDP socket using socket.socket(socket.AF_INET, socket.SOCK_DGRAM) to send the sensor readings to the server.", "The sensordata() function calls Adafruit_DHT.read_retry(sensor,17), which returns the humidity and temperature values from the DHT sensor.", "The server code opens 'Datalog.txt' in append mode and writes the received message from the client into this text file.", "The split() function splits a string into multiple strings based on a specified separator/delimiter, e.g. Data.split(\",\") splits data wherever a comma is found.", "MATPLOTLIB is a Python library used to create 2D plots; functions such as plot(), xlabel(), ylabel(), and title() are used to plot and label the sensor data.", "ion() turns on the interactive mode in matplotlib. Other common plotting functions mentioned include figure(), grid(), subplot(), close(), and scatter().", "In the current network, protocols like OSPF execute at the switches, which forward traffic in a distributed manner with no centralized control.", "The idea of software-defined networking originated from the OpenFlow project, presented at ACM SIGCOMM in 2008. Stanford published the OpenFlow V1.0.0 specification the following year.", "When no flow-rule is present for an incoming request, the switch sends a PACKET-IN message to the controller, which then decides a suitable flow-rule and inserts it at the switch.", "The Southbound API is used to communicate between the control layer and the infrastructure layer using the OpenFlow protocol. The Northbound API communicates between the control and application layers.", "The lecture states that a controller can typically handle around 200 requests in a second through a single thread.", "In centralized control, control decisions are taken in a centralized manner by a single controller, unlike distributed control where each subnetwork is controlled by a different controller.", "Benefits of integrating SDN in IoT include intelligent routing decisions, simplified information collection/analysis/decision-making, visibility of network resources, and intelligent traffic pattern analysis.", "Wireless sensor network challenges include real-time programming of sensor nodes, vendor-specific architecture, resource-constrained (heavy computation cannot be performed) devices, and limited memory, meaning too many control programs cannot be inserted.", "In the SDN-WISE protocol stack, the forwarding layer above IEEE 802.15.4 technology consists of flow-rules, and INPP stands for In Network Packet Processing."],
                                8: ["Traditional mobile networks are difficult to scale because static, over-provisioned networks are inflexible to manage high-demand mobile traffic; they are also difficult to manage, inflexible, and cost-expensive.", "In ODIN, an agent is placed at access points (with the physical devices) to communicate with the controller, while the Odin master resides at the controller end.", "Mobi-Flow predicts the location of end-users at time (t+1) while they are at time (t), and places flow-rules at the access points that can be associated with the users based on their predicted locations, using an order-K Markov predictor.", "Mininet-WiFi can be used to deploy a network supporting both wired (Ethernet) and wireless (WiFi, IEEE 802.11) protocols, while ONOS can be used to place the controllers.", "NIST defines cloud computing as a model for enabling convenient, on-demand network access to a shared pool of configurable computing resources such as networks, servers, storage, and applications.", "NIST lists rapid elasticity as an essential characteristic, meaning cloud resource allocation and release should be rapid, elastic, and automatic, giving consumers the impression of infinite resources.", "A private cloud is a cloud set-up functioned only for a single organization, typically managed by the organization itself (on-premises) or by a third party (off-premises).", "Public cloud examples given include Amazon Web Services (AWS), Google Compute Engine, and Microsoft Azure — cloud set-ups available for the use of any person or industry.", "Infrastructure-as-a-Service (IaaS) contains the basic building blocks for cloud IT, providing access to networking features, computers (virtual or dedicated hardware), storage, and operating systems.", "In IaaS, the hypervisor sits above the physical hardware and manages multiple virtual machines (VMs), each running its own operating system, on a virtualized server.", "Platform-as-a-Service (PaaS) removes the need for organizations to manage underlying infrastructure (hardware and OS) and lets developers focus on deploying and managing their applications; it is described as application middleware offered as a service.", "An SLA defines the non-functional requirements expected from the service provider and provides a roadmap with clearly defined deliverables, describing the quality, utility, and warranty of services expected by the customer.", "Service accounting aims to obtain resource usage information, typically in the form of records, depending on infrastructure and service monitoring where usage information is obtained from metric measurements.", "Simulation tools provide a reliable, scalable, and repeatable environment for performance evaluation, facilitating pre-deployment tests of services at no cost and enabling repeatable evaluation.", "CloudSim is a simulation framework that models cloud computing environments (data centers, VMs, applications, users, and network topology), written in a Java-based environment, and developed at the CLOUDS Lab of the University of Melbourne."],
                                    9: ["OpenStack, a software used to create cloud infrastructure, was launched as a joint project of Rackspace Hosting and NASA in 2010, and is open source.", "Horizon is the dashboard component of OpenStack — it provides the GUI of the software and gives an overview of the other components.", "Nova is the compute service in OpenStack — it is where you launch your instances. Glance is the image service, Cinder is block storage, and Neutron provides networking.", "OpenStack is installed using Devstack: after cloning the devstack repository and configuring local.conf with ADMIN_PASSWORD, DATABASE_PASSWORD, RABBIT_PASSWORD, SERVICE_PASSWORD, and HOST_IP, the stack.sh file is run to install it.", "Sensor-cloud is not mere integration of sensors and cloud computing or 'dumping sensor data into the cloud' — it introduces the concept of virtualization of the sensor node, offered on a pay-per-use basis, acting as a stratum between sensor nodes and end-users.", "In a traditional WSN, the WSN-user is responsible for ownership, deployment, redeployment, maintenance, overhead, and usage. In sensor-cloud, redeployment and maintenance shift to the Sensor-Cloud Service Provider (SCSP), while usage shifts to the end-user.", "The Sensor-owner purchases physical sensor devices deployed over different geographical locations and lends these devices to the sensor-cloud, acting as a business actor.", "Limitations of WSNs include procurement issues (price, right vendor, sensor types), deployment and maintenance overheads, and difficulty adapting to a change of requirement — e.g., a WSN built for agriculture cannot easily be repurposed for a smart home.", "CoV-I refers to the formation of a Virtual Sensor (VS) using homogeneous sensor nodes within the same geographical boundary, while CoV-II spans multiple regions using heterogeneous nodes to form a Virtual Sensor Group (VSG).", "The Internal Cache (IC) handles requests from the end-user and takes the decision on whether the data should be provided directly or whether it is required to re-cache the data from the External Cache (EC).", "In many cases, environmental conditions change quite slowly, so the sensed data of physical sensors remains largely unaltered; unnecessary sensing under such conditions causes needless energy consumption, motivating adaptive caching.", "Fog computing, or 'fogging,' is a term coined by CISCO. The idea is to extend the cloud nearer to IoT devices by introducing an intermediate layer between the cloud and the devices.", "The current cloud model faces issues of Volume (too much data to process/store), Latency (round-trip time is too slow for time-sensitive data), and Bandwidth (huge traffic generated by billions of devices consumes most available bandwidth).", "Fog is a layer between the cloud and IoT devices; many fog nodes can be present, and sensor data are processed in the fog before being sent to the cloud, reducing latency and saving bandwidth and cloud storage.", "Fog nodes need transient storage, computing facility (to process data and take quick decisions), and network connectivity to connect with IoT devices, other fog nodes, and the cloud — not permanent unlimited archival storage, which is the cloud's role."],
                                        10: ["In the human–smart city analogy, Sensors and Tags correspond to Sensory Organs, Buildings/Industries/People correspond to the Skeleton, digital telecommunication networks correspond to Nerves, and ubiquitously embedded intelligence corresponds to the Brain.", "The six application focus areas listed are Smart Economy, Smart Governance, Smart People, Smart Mobility, Smart Environment, and Smart Living.", "Smart Parking Lots focus on auto routing of vehicles to empty slots, auto charging for services provided, and detection of vacant slots in the parking lot.", "Under Security and Privacy challenges, the lecture notes exposure to attacks and vulnerabilities, and that multi-tenancy induces the risk of data leakage.", "Data fusion addresses the challenge of making large, incoming data volumes precise and accurate, since the quality of data precision and accuracy directly affects the quality of decision-making in IoT-enabled smart cities.", "Conflicts arise when the same sensor type reports different data for the same location. Imperfection refers to inaccurate/uncertain sensor data, Ambiguity refers to outliers/missing data, and Alignment relates to converting sensor data frames to a singular frame.", "Signal level fusion occurs at the sensor node or within the local network itself, while pixel level occurs at the imaging device, feature level occurs prior to decision making, and decision level is an ensemble of decisions.", "Smart parking has three functional layers: Information Collection, System Deployment, and Service Dissemination.", "Dedicated energy harvesting involves energy sources intentionally deployed near IoT sources, with the amount of energy harvested depending on the sensitivity of the harvesting circuit, the distance between device and source, and the environment.", "Zigbee consists of four layers (Physical, MAC, Network, Application); the Physical and MAC layers are defined by IEEE 802.15.4, while Network and Application layers are defined by Zigbee itself, and it targets low-cost, low-energy devices.", "X-10 enables remote control of compliant transmitters and receivers over power lines and electrical wiring, is adopted by GE and Philips, has low speed and low data rate, and is mainly used for control of lighting, appliance networks, and security sensors.", "TCP/IP is designed mainly for handling information exchange between a single pair of entities, is dependent on the location of data, and can only identify endpoint addresses — which alone is not useful for content distribution in highly mobile V2X environments.", "The US Department of Transport and Federal Communications Commission allocated 75 MHz (5850–5925 MHz) as the dedicated spectrum for ICVs, based on Dedicated Short Range Communication (DSRC) technology.", "Phase-1 covers infotainment services based on 2G/3G, Phase-2 covers intelligent transportation services based on 4G LTE or DSRC, and Phase-3 covers vehicles connected to the cloud.", "The Ad-hoc Domain is composed of vehicles (OBUs, which are mobile) and Road-Side Units (RSUs, which are static); communication may be V2V or V2I, carried out through the DSRC stack (IEEE 802.11p)."],
                                            11: ["The lecture describes a smart grid as a modernized grid that supports bidirectional energy flow and two-way communication and control, unlike the traditional grid's one-directional operation.", "Smart meters operate digitally and provide the interface for automated information exchange between the consumer side and the energy service provider.", "Time-of-Use pricing encourages consumers to shift energy consumption to off-peak periods, when grid load is lower and the price of energy is lower.", "The lecture states that net-metering bills depend on both the energy received by the consumer from the grid and the excess energy supplied by the consumer back to the grid.", "A PMU samples voltage and current at its installed location. Multiple PMUs form a phasor network whose information can be analyzed by a centralized SCADA system.", "Distribution intelligence uses smart IoT devices and smart meters to identify outage sources, support automated switching, optimize real and reactive power, and protect feeder lines.", "The lecture explains that a gateway connects a group of closely located smart meters and acts as the communication link between those smart meters and the DAUs.", "The lecture identifies attacks that compromise availability as Denial of Service attacks. Such attacks may block key signals and affect grid stability and observability.", "IIoT applies IoT concepts to industrial systems and connects automation with enterprise functions, planning, and product lifecycle activities.", "The lecture states that IIoT is based on a 'wrap and re-use' approach rather than a 'rip and replace' approach, allowing existing industrial assets to be integrated.", "The lecture identifies DSRC as the key enabling technology for V2V and V2R communications in connected transportation systems.", "For mining safety, the lecture describes the use of RFID, Wi-Fi, and other wireless technologies for early warning, air-quality monitoring, poisonous-gas detection, and oxygen-level monitoring.", "The lecture defines veracity in terms of bias, noise, and abnormality in data and emphasizes its importance for automated decision-making and machine learning.", "Redundancy mitigation removes repeated data using detection, filtering, and compression, helping avoid unnecessary transmission and storage.", "The Namenode maintains filesystem metadata, while Datanodes store the actual data. HDFS divides files into blocks and replicates those blocks across Datanodes."],
                                                12: ["Qualitative analysis deals with categorical data, whereas quantitative analysis is used for numerical data.", "A complete statistical model has the same number of variables as equations. If these numbers do not match, the model is incomplete.", "ANOVA is introduced as a parametric statistical technique for comparing datasets and is especially useful when more than two populations or samples are being compared.", "Pearson's correlation coefficient is used to measure the strength of association between two quantitative, continuous variables.", "AgriSens aims to improve water management by using less water while maintaining or improving crop yield, along with automatic irrigation and remote monitoring.", "The proposed AgriSens architecture is organized into a sensing and actuating layer, a processing, storage and service layer, and an application layer.", "The AgriSens sensor node contains sensors and actuators, a processing and memory unit, a wireless communication unit, and a power management unit.", "The multi-user server communicates field information to farmers through SMS and also processes farmer queries and control commands.", "The aggregated layer collects data from sensing-layer devices. Smartphones and tablets are given as examples of aggregators.", "The lecture presents fall detection, emergency situation detection, and early anomaly detection as examples of preventive care using IoT healthcare.", "Continuous monitoring helps observe daily behavior over long periods and identify repetitive patterns that can improve the reliability of activity recognition.", "The lecture states that deep-learning-based analysis can be applied to ordinary sensor data as well as image and video data.", "In the in-place approach, activity data are processed on the device itself. This is generally power intensive but does not require a network connection for the processing task.", "The demonstration uses a smartphone to generate sensor data, a network to carry the data, and a remote server to receive and process or visualize it.", "For the demonstration, the smartphone transmits accelerometer readings to the remote server, where the data are continuously logged."]

        function cust() { const ks = [...document.querySelectorAll(".cw:checked")].map(x => x.value), n = +document.getElementById("cn").value || 20; start("cust", shuf(all().filter(c => ks.includes(c.w))).slice(0, n)) }
        function start(m, pool) {
            pool = pool || (m == "all" ? shuf(all()) : m == "rand" ? shuf(all()).slice(0, 50) : m == "star" ? shuf(all().filter(c => P.star[c.t])) : m == "miss" ? shuf(all().filter(c => P.miss[c.t])) : W[m].q.map((x, i) => ({ ...x, w: m, e: E[m][i] })));
            if (!pool.length) { alert("No questions here yet."); return }
            pool = pool.map(c => { if (!P.sh || c.o.length < 4 || c.o.some(o => /^(True|Both|None of|Neither)/.test(o) || /Both \(a\)/.test(o))) return c; const ix = shuf([0, 1, 2, 3]); return { ...c, o: ix.map(i => c.o[i]), a: Array.isArray(c.a) ? c.a.map(x => ix.indexOf(x)).sort() : ix.indexOf(c.a) } });
            S = { m, pool, i: 0, sc: 0, wrong: [], done: false }; ask()
        }
        function ask() {
            const c = S.pool[S.i], n = S.pool.length, M = Array.isArray(c.a), F = M ? 'tog' : 'pick';
            const mn = { all: "Complete quiz", rand: "Random quiz", star: "Starred", miss: "Weak spots", cust: "Custom quiz" }[S.m] || W[S.m].n.split(" · ")[1];
            app.innerHTML = `<div class="qw"><div class="qh"><button class="sec" onclick="home()" aria-label="Exit">✕</button><div class="qt"><b>${mn}</b><span>Question ${S.i + 1} of ${n}</span></div><div class="sc">${S.sc} ✓</div></div>
 <div class="bar"><i style="width:${S.i / n * 100}%"></i></div>
 <article class="qc"><div class="row"><span class="chip2">Week ${c.w}</span>${M ? '<span class="chip2 m">Select all that apply</span>' : ''}<button class="sec star" onclick="star(this)" aria-label="Star question">${P.star[c.t] ? "★" : "☆"}</button></div>
 <h2>${c.t}</h2>${c.o.map((o, i) => `<button class="opt" onclick="${F}(${i})"><b>${L[i]}</b><span>${o}</span></button>`).join("")}</article>
 <div id="nx">${M ? '<button class="pri" onclick="sub()">Submit answer</button>' : ''}</div></div>`; window.scrollTo(0, 0)
        }
        function star(b) { const c = S.pool[S.i]; if (P.star[c.t]) delete P.star[c.t]; else P.star[c.t] = 1; b.textContent = P.star[c.t] ? "★" : "☆"; sp() }
        function pick(i) { fb(new Set([i])) }
        function tog(i) { document.querySelectorAll(".opt")[i].classList.toggle("sel") }
        function sub() { fb(new Set([...document.querySelectorAll(".opt")].flatMap((b, j) => b.classList.contains("sel") ? [j] : []))) }
        function fb(sel) {
            const c = S.pool[S.i], A = [].concat(c.a), ok = sel.size == A.length && A.every(j => sel.has(j));
            document.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; b.classList.remove("sel"); if (A.includes(j)) b.classList.add(sel.has(j) || A.length == 1 ? "ok" : "miss"); else if (sel.has(j)) b.classList.add("bad") });
            P.tot++; if (ok) { S.sc++; P.ok++; delete P.miss[c.t] } else { S.wrong.push(c); P.miss[c.t] = 1 } sp();
            const last = S.i == S.pool.length - 1;
            if (c.e) document.getElementById("nx").insertAdjacentHTML("beforebegin", `<div class="ex"><b>Why?</b> ${c.e}</div>`); document.getElementById("nx").innerHTML = `<button class="pri" onclick="${last ? 'fin()' : 'S.i++;ask()'}">${last ? "See results" : "Next →"}</button>`
        }
        function fin() {
            const n = S.pool.length, p = Math.round(S.sc / n * 100); save(S.m, S.sc);
            const msg = p >= 90 ? "Outstanding! 🏆" : p >= 70 ? "Great job! 🎉" : p >= 50 ? "Good effort, keep going 💪" : "Keep practising 📖";
            app.innerHTML = `<div class="qw"><section class="rs"><div class="ring" style="--p:${p}"><div><b>${p}%</b><span>${S.sc} of ${n}</span></div></div><h1>${msg}</h1>
 <div class="m3"><div><b>${S.sc}</b><span>Correct</span></div><div><b>${S.wrong.length}</b><span>Missed</span></div><div><b>${n}</b><span>Total</span></div></div>
 <div class="row res"><button class="pri" onclick="start('${S.m}')">Retake</button>${S.wrong.length ? `<button class="sec" onclick="start('${S.m}',shuf(S.wrong))">Retry ${S.wrong.length} missed</button>` : ""}<button class="sec" onclick="home()">Home</button></div></section>
 ${S.wrong.length ? `<h3 class="sh">Review missed (${S.wrong.length})</h3>` + S.wrong.map(c => `<div class="card rv"><span class="chip2">Week ${c.w}</span><p>${c.t}</p><div class="ca">✓ ${[].concat(c.a).map(j => c.o[j]).join("; ")}</div>${c.e ? `<div class="ex">${c.e}</div>` : ""}</div>`).join("") : "<p class='mu' style='text-align:center'>Perfect score, nothing to review!</p>"}</div>`; window.scrollTo(0, 0)
        }
        home();
    </script>
</body>

</html>
