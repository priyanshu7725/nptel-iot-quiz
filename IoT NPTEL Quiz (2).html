1:["ITU report: humans may become a minority of traffic generators; most traffic flows between devices and things.","IoT needs scalability, clear naming/addressing and support for sleeping, mobile and non-IP nodes; connectivity can be intermittent.","Smart Dust: sand-grain-sized computing devices sprayed or injected to sense chemicals or diagnose body problems.","M2M covers machine-to-machine links; IoT is broader, including things, people, applications and systems.","Web of Things doesn’t replace sensors; they still collect physical data while web technologies expose it.","Reusing local addresses across gateway domains avoids wasting global addresses.","Gateways give Internet and LAN connectivity, get prefixes via DHCPv6 and delegate to nodes with SLAAC.","IPv6 uses 128-bit hexadecimal addresses (IPv4: 32-bit dotted decimal), suiting large-scale IoT.","A good sensor reacts to the target property, ignores unrelated ones and doesn’t alter what it measures.","Resolution is the smallest detectable change; accuracy differs, since bias or calibration errors can hurt a high-resolution sensor.","An accelerometer’s output has magnitude and direction along x, y, z, so it is a vector sensor.","Hysteresis: output depends on whether the input was approached from below or above.","Liquids are nearly incompressible, so hydraulic actuators exert large forces.","SMP actuators respond to many stimuli, recover strain well, are light and biocompatible; they aren’t just passive sensors.","Sensor data passes through the gateway and proxy server before reaching the cloud."],

 pool=pool||(m=="all"?shuf(all()):m=="rand"?shuf(all()).slice(0,50):m=="star"?shuf(all().filter(c=>P.star[c.t])):m=="miss"?shuf(all().filter(c=>P.miss[c.t])):W[m].q.map((x,i)=>({...x,w:m,e:E[m][i]})));
 if(!pool.length){alert("No questions here yet.");return}
 pool=pool.map(c=>{if(!P.sh||c.o.length<4||c.o.some(o=>/^(True|Both|None of|Neither)/.test(o)||/Both \(a\)/.test(o)))return c;const ix=shuf([0,1,2,3]);return{...c,o:ix.map(i=>c.o[i]),a:Array.isArray(c.a)?c.a.map(x=>ix.indexOf(x)).sort():ix.indexOf(c.a)}});
 S={m,pool,i:0,sc:0,wrong:[],done:false};ask()}
function ask(){
 const c=S.pool[S.i],n=S.pool.length,M=Array.isArray(c.a),F=M?'tog':'pick';
 const mn={all:"Complete quiz",rand:"Random quiz",star:"Starred",miss:"Weak spots",cust:"Custom quiz"}[S.m]||W[S.m].n.split(" · ")[1];
 app.innerHTML=`<div class="qw"><div class="qh"><button class="sec" onclick="home()" aria-label="Exit">✕</button><div class="qt"><b>${mn}</b><span>Question ${S.i+1} of ${n}</span></div><div class="sc">${S.sc} ✓</div></div>
 <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
 <article class="qc"><div class="row"><span class="chip2">Week ${c.w}</span>${M?'<span class="chip2 m">Select all that apply</span>':''}<button class="sec star" onclick="star(this)" aria-label="Star question">${P.star[c.t]?"★":"☆"}</button></div>
 <h2>${c.t}</h2>${c.o.map((o,i)=>`<button class="opt" onclick="${F}(${i})"><b>${L[i]}</b><span>${o}</span></button>`).join("")}</article>
 <div id="nx">${M?'<button class="pri" onclick="sub()">Submit answer</button>':''}</div></div>`;window.scrollTo(0,0)}
function star(b){const c=S.pool[S.i];if(P.star[c.t])delete P.star[c.t];else P.star[c.t]=1;b.textContent=P.star[c.t]?"★":"☆";sp()}
function pick(i){fb(new Set([i]))}
function tog(i){document.querySelectorAll(".opt")[i].classList.toggle("sel")}
function sub(){fb(new Set([...document.querySelectorAll(".opt")].flatMap((b,j)=>b.classList.contains("sel")?[j]:[])))}
function fb(sel){
 const c=S.pool[S.i],A=[].concat(c.a),ok=sel.size==A.length&&A.every(j=>sel.has(j));
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;b.classList.remove("sel");if(A.includes(j))b.classList.add(sel.has(j)||A.length==1?"ok":"miss");else if(sel.has(j))b.classList.add("bad")});
 P.tot++;if(ok){S.sc++;P.ok++;delete P.miss[c.t]}else{S.wrong.push(c);P.miss[c.t]=1}sp();
 const last=S.i==S.pool.length-1;
 if(c.e)document.getElementById("nx").insertAdjacentHTML("beforebegin",`<div class="ex"><b>Why?</b> ${c.e}</div>`);document.getElementById("nx").innerHTML=`<button class="pri" onclick="${last?'fin()':'S.i++;ask()'}">${last?"See results":"Next →"}</button>`}
function fin(){
 const n=S.pool.length,p=Math.round(S.sc/n*100);save(S.m,S.sc);
 const msg=p>=90?"Outstanding! 🏆":p>=70?"Great job! 🎉":p>=50?"Good effort, keep going 💪":"Keep practising 📖";
 app.innerHTML=`<div class="qw"><section class="rs"><div class="ring" style="--p:${p}"><div><b>${p}%</b><span>${S.sc} of ${n}</span></div></div><h1>${msg}</h1>
 <div class="m3"><div><b>${S.sc}</b><span>Correct</span></div><div><b>${S.wrong.length}</b><span>Missed</span></div><div><b>${n}</b><span>Total</span></div></div>
 <div class="row res"><button class="pri" onclick="start('${S.m}')">Retake</button>${S.wrong.length?`<button class="sec" onclick="start('${S.m}',shuf(S.wrong))">Retry ${S.wrong.length} missed</button>`:""}<button class="sec" onclick="home()">Home</button></div></section>
 ${S.wrong.length?`<h3 class="sh">Review missed (${S.wrong.length})</h3>`+S.wrong.map(c=>`<div class="card rv"><span class="chip2">Week ${c.w}</span><p>${c.t}</p><div class="ca">✓ ${[].concat(c.a).map(j=>c.o[j]).join("; ")}</div>${c.e?`<div class="ex">${c.e}</div>`:""}</div>`).join(""):"<p class='mu' style='text-align:center'>Perfect score, nothing to review!</p>"}</div>`;window.scrollTo(0,0)}
home();
</script></body></html>
